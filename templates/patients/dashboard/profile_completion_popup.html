<div class="profile-completion-overlay" id="profileCompletionPopup">

    <div class="profile-completion-popup">

        <button type="button" class="profile-completion-close" id="profileCompletionClose" aria-label="Close">
            &times;
        </button>

        <div class="profile-completion-icon">
            <i data-lucide="user-round"></i>
        </div>

        <h2>Complete Your Profile</h2>

        <p>
            Your patient profile is incomplete. Please complete your
            medical information so we can provide you with the best
            possible experience.
        </p>

        <form method="POST" action="{% url 'dismiss_profile_popup' %}">
            {% csrf_token %}

            <input type="hidden" name="redirect" value="profile">

            <button type="submit" class="profile-completion-button">
                Complete Profile
            </button>
        </form>

        <button type="button" class="profile-completion-later" id="profileCompletionLater">
            Maybe Later
        </button>

    </div>

</div>
