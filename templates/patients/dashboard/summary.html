{% load static %}

<section class="patient-card patient-summary">

    <div class="patient-summary__profile">

        <img src="{% static 'images/patient-avatar.jpg' %}" alt="Patient {{ patient.name }}"
            class="patient-summary__photo" width="512" height="512">

        <div class="patient-summary__identity">

            <h2 class="patient-summary__name">
                {{ patient.name }}
            </h2>


            <div class="patient-summary__contacts">

                <span>
                    <i data-lucide="phone"></i>
                    {{ patient.phone }}
                </span>

                <span>
                    <i data-lucide="mail"></i>
                    {{ patient.email }}
                </span>

                <span>
                    <i data-lucide="map-pin"></i>
                    {{ patient.address }}
                </span>

            </div>

        </div>

    </div>


    <dl class="patient-summary__details">

        <div class="patient-summary__detail">
            <dt>DOB</dt>
            <dd>{{ patient.date_of_birth }}</dd>
        </div>

        <div class="patient-summary__detail">
            <dt>Member Since</dt>
            <dd>{{ patient.member_since }}</dd>
        </div>

        <div class="patient-summary__detail">
            <dt>Status</dt>
            <dd>{{ patient.status }}</dd>
        </div>

        <div class="patient-summary__detail">
            <dt>Age</dt>
            <dd>{{ patient.age }} Years</dd>
        </div>

        <div class="patient-summary__detail">
            <dt>Gender</dt>
            <dd>{{ patient.gender }}</dd>
        </div>

        <div class="patient-summary__detail">
            <dt>Blood Group</dt>
            <dd>{{ patient.blood_type }}</dd>
        </div>

    </dl>

</section>
