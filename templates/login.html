{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In — MediCare Health Platform</title>
    <meta name="description" content="Sign in to MediCare, the premium healthcare technology platform.">

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>

    <a class="login-brand-mark" href="{% url 'landing' %}" aria-label="MediCare home">
        <img src="{% static 'images/logo.webp' %}" alt="MediCare">
    </a>

    <a href="{% url 'landing' %}" class="login-back-home" aria-label="Back to home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Back to Home</span>
    </a>

    <main class="login-page">

        <div class="login-background" aria-hidden="true">
            <div class="login-glow login-glow--left"></div>
            <div class="login-glow login-glow--right"></div>
            <div class="login-background-ring"></div>
        </div>

        <section class="login-container">

            <div class="login-circle">

                <div class="login-ring" aria-hidden="true">
                    <div class="login-ring__track"></div>
                    <div class="login-ring__progress"></div>
                </div>

                <div class="login-content">

                    <div class="login-brand">
                        <span class="login-logo">
                            <i class="fas fa-heartbeat" aria-hidden="true"></i>
                        </span>

                        <span class="login-brand-name">MediCare</span>
                    </div>

                    <h1>Welcome Back</h1>

                    <p class="login-subtitle">
                        Sign in to continue to your care dashboard.
                    </p>

                    <form class="login-form" id="loginForm">

                        {% csrf_token %}

                        <div class="login-field">
                            <label for="email">Email</label>

                            <input id="email" name="email" type="email" autocomplete="email"placeholder="jane.doe@example.com" required>
                        </div>

                        <div class="login-field">
                            <label for="password">Password</label>

                            <div class="password-wrapper">

                                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>

                                <button type="button" class="password-toggle" id="passwordToggle"
                                    aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" id="passwordIcon" aria-hidden="true"></i>
                                </button>

                            </div>
                        </div>

                        <button type="submit" class="login-submit" id="loginSubmit">
                            Sign In
                        </button>

                        <p class="login-register">
                            New to MediCare?
                            <a href="{% url 'register' %}">
                                Create an account
                            </a>
                        </p>

                        <div class="login-forgot">
                            <a href="#">
                                Forgot password?
                            </a>
                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <script src="{% static 'js/login.js' %}"></script>

</body>

</html>
