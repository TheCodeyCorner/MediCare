{% load static %}

<!-- ============================================================
     Queue Summary
     ============================================================ -->

<div class="admin-live-queue-summary">

    <div class="admin-card__header admin-live-queue-card__header">

        <div class="admin-card__title-group">

            <div class="admin-card__icon">
                <i data-lucide="bar-chart-3"></i>
            </div>

            <h3 class="admin-card__title">
                Live Queue Statistics
            </h3>

        </div>

    </div>


    <!-- ========================================================
     Total Patients
     ======================================================== -->

    <div class="admin-live-queue-summary-card admin-live-queue-summary-card--blue">

        <div class="admin-live-queue-summary-card__icon">
            <i data-lucide="users-round"></i>
        </div>

        <div class="admin-live-queue-summary-card__info">

            <span class="admin-live-queue-summary-card__title">
                Appointments in Queue
            </span>

            <span class="admin-live-queue-summary-card__value">
                {{ queue_patient_count }}
            </span>

            <span class="admin-live-queue-summary-card__sub">
                Across all departments
            </span>

        </div>

    </div>


    <!-- ========================================================
     Estimated Wait
     ======================================================== -->

    <div class="admin-live-queue-summary-card admin-live-queue-summary-card--green">

        <div class="admin-live-queue-summary-card__icon">
            <i data-lucide="clock-3"></i>
        </div>

        <div class="admin-live-queue-summary-card__info">

            <span class="admin-live-queue-summary-card__title">
                Average Predicted Duration
            </span>

            <span class="admin-live-queue-summary-card__value">
                {{ queue_average_duration }} min
            </span>

            <span class="admin-live-queue-summary-card__sub">
                For active appointments today
            </span>

        </div>

    </div>

</div>
