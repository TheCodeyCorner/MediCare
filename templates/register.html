{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — MediCare</title>
    <meta name="description" content="Create an account on MediCare, the premium healthcare technology platform.">

    <link rel="stylesheet" href="{% static 'css/register.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>

    <a class="register-brand-mark" href="{% url 'landing' %}" aria-label="MediCare home">
        <img src="{% static 'images/logo.webp' %}" alt="MediCare">
    </a>

    <a href="{% url 'landing' %}" class="register-back-home" aria-label="Back to home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Back to Home</span>
    </a>

    <main class="register-page">

        <div class="register-background" aria-hidden="true">
            <div class="register-glow register-glow--left"></div>
            <div class="register-glow register-glow--right"></div>
            <div class="register-background-ring"></div>
        </div>

        <section class="register-container">

            <div class="register-circle">

                <div class="register-ring" aria-hidden="true">
                    <div class="register-ring__track"></div>
                    <div class="register-ring__progress"></div>
                </div>

                <div class="register-content">

                    <div class="register-brand">
                        <span class="register-logo">
                            <i class="fas fa-heartbeat" aria-hidden="true"></i>
                        </span>

                        <span class="register-brand-name">MediCare</span>
                    </div>

                    <h1>Create Account</h1>

                    <form class="register-form" id="registerForm" method="post">
                        {% csrf_token %}

                        <div class="register-field">
                            <label for="email">Email</label>

                            <input id="email" name="email" type="email" autocomplete="email"
                                placeholder="jane.doe@example.com" required>
                        </div>

                        <div class="register-field">
                            <label for="password">Password</label>

                            <div class="password-wrapper">

                                <input id="password" name="password" type="password" autocomplete="new-password"
                                    placeholder="••••••••" required>

                                <button type="button" class="password-toggle" data-password-target="password"
                                    aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>

                            </div>
                        </div>

                        <div class="register-field">
                            <label for="confirmPassword">Confirm Password</label>

                            <div class="password-wrapper">

                                <input id="confirmPassword" name="confirm_password" type="password"
                                    autocomplete="new-password" placeholder="••••••••" required>

                                <button type="button" class="password-toggle" data-password-target="confirmPassword"
                                    aria-label="Show password" aria-pressed="false">
                                    <i class="fas fa-eye" aria-hidden="true"></i>
                                </button>

                            </div>
                        </div>

                        <button type="submit" class="register-submit" id="registerSubmit">
                            Create Account
                        </button>

                        <p class="register-register">
                            Already have an account?
                            <a href="{% url 'login' %}">
                                Log in
                            </a>
                        </p>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <script src="{% static 'js/register.js' %}"></script>

</body>

</html>
